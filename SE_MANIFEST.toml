# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "spec-se"
class = "specification"
kind = "specification"
status = "active"
since = "2025"
summary = "Defines the Structural Explainability specification."

# === Layer Position ===

[layer]
space = "structural-explainability"
role = "specification"

# === Dependency Declarations ===

[depends]
required = []
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "README.md",
  "SPEC.md",
  "SPEC_LAYERS.md",
  "IDENTIFIERS.md",
  "CONFORMANCE.md",
  "manifests/se-manifest-1.md",
  "ANNOTATIONS.md",
  "CHANGELOG.md",
  "CITATION.cff",
  "LICENSE",
]

# === Scope ===

[scope]
includes = [
  "Structural Explainability specification material",
  "core specification terminology",
  "specification-level constraints and definitions",
]
excludes = [
  "implementation code",
  "formal proof artifacts",
  "machine-readable contract exports",
]

# === Citation ===

[citation]
cff = "CITATION.cff"
preferred = "Cite this repository using CITATION.cff."

# === Traceability ===

[traceability]
identifier_map = "SE_MANIFEST.toml"
